[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-ai-analytics-copilot"
version = "0.1.0"
description = "A portfolio-grade e-commerce analytics project with an evaluated AI copilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.40,<2.0",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
ecommerce-copilot = "ecommerce_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
